# A 题「药材的烘干问题」集中配置 v1.2（定点返修，2026-09-12；可由标准 YAML 解析器加载；由 config_check.py 校验）
# 参数分类（PATCH-01/04）：
#   - 题给物理参数：带 {value, unit, source}，source ∈ {"题面Q1","附录2","附录3","附录4","附件1","附件2"} 或 "D0x/B0x/H0x"（决策/约定编号）。
#   - 主线假设 / 数值控制参数 / 情景扰动：允许简洁字段（单位明确即可，不强制三标签）。
# 公式字符串仅作说明；运行时由 props.py 映射到明确函数，不使用 eval；说明式与当前附录函数的对应由 config_check 校验。
version: "1.2"
revision: "定点返修 2026-09-12"
status_note: "配置解析通过 ≠ 模型验证通过，更 ≠ 公式—配置一致；D12 生产配置由适用于该问的数值检验选定并登记，V-8/V-9 属导出后文件验收（非 D12 前置）；生产须经验收后由 production.approved=true 标记（当前 false）"

geometry:
  R0: {value: 0.02, unit: "m", source: "题面Q1"}
  L: {value: 0.25, unit: "m", source: "题面Q1", note: "固定，H01"}

initial:
  T0: {value: 28.0, unit: "degC", source: "题面Q1"}
  C0: {value: 2.55, unit: "kg/kg", source: "题面Q1"}

bc:
  h: {value: 25.0, unit: "W/(m^2 K)", source: "附录2", reuse_q2_q4: true, reuse_note: "跨问沿用为额外有效系数假设（D04, H07）"}
  hm: {value: 8.0e-7, unit: "m/s", source: "附录2", reuse_q2_q4: true, reuse_note: "同上"}
  mass_basis: "effective_C"          # D02-A；候选 emc_isotherm / vapor_density 未实现
  heat_latent: false                 # D05-A；true 仅用于 8.3 结构性检验（不入主线，不导出 result）

air:
  file: "附件1.xlsx"
  read_only: true
  interp: "linear"                   # D07-A；唯一情景 "smooth121"
  extrapolation: "hold_window_mean"  # D03-A；对照 "hold_last"
  window_s: [10800, 14400]           # 含两端点，61 个原始样本，运行时全精度计算均值
  breakpoints_s: [14400]
  sensitivity:
    dT_degC: 0.39                    # 只作用于外推段
    dC: 0.0011                       # 只作用于外推段

radius:
  file: "附件2.xlsx"
  interp: "linear"                   # B12a
  after_72h: "hold_last"             # B12b：1.198 cm = 0.01198 m，仅在超过 72 h 时生效并记录外推区间
  inside_tol: 1.0e-12                # r_j <= R(t)*(1+tol) 判域内（含相等）

props:
  q1:
    rho: {value: 820.0, unit: "kg/m^3", source: "附录2"}
    cp: {value: 2600.0, unit: "J/(kg K)", source: "附录2"}
    k: {value: 0.36, unit: "W/(m K)", source: "附录2"}
    D_formula: "7e-9*exp(-0.89/C)"   # 说明；函数 props.D_app2(C)
  q23:
    rho_formula: "650+128*C"
    cp_formula: "1450+2736*C/(C+1)"
    k_formula: "0.21+0.38*C/(C+1)"
    D_formula: "2.4e-3*exp(-0.45/C)*exp(-3850/T_K)"
    source: "附录3"
  q4:
    rho_formula: "760+90*C"
    cp_formula: "1850+2150*C/(C+1)"
    k_formula: "0.12+0.20*C/(C+1)"
    D_formula: "4.2e-4*exp(-0.30/C)*exp(-3850/T_K)"
    source: "附录4"
  rho_role: "effective_heat_capacity"   # D06 Ⅰ-A
  rho_s0: "rho(C0)/(1+C0)"              # H12；备选 "rho(0)"（仅换算）
  energy_form: "effective"              # Ⅰ-B "enthalpy_advective" 仅登记，未实现
  guards:
    C_floor_for_exp: 1.0e-300           # 仅防除零；C<=0 时 D:=0 并计数，不裁剪状态
    exp_underflow_arg: -700.0

numerics:
  scheme_baseline: "backward_euler"     # 验证基线（B06）
  scheme_production_candidate: "BDF"    # 经验证后可用于长时生产/情景
  interface: "harmonic"                 # 当前默认（B11）；优先待验收候选 "integral"（积分界面）
  quadrature:                           # 积分界面 Gauss–Legendre 求积（PATCH-04）
    interface_points: 8                 # 生产求值点数
    interface_points_check: 16          # 对照点数（独立数值键，非提高精度用）
  N_default: 200                        # 仅验证基线；非无条件物理要求
  N_verify: [100, 200, 400, 800]
  dt_be_s: 1.0
  dt_be_verify_s: [1.0, 0.5, 0.25]
  # 分问数值配置（PATCH-03/04）：最终网格由各问自身输出误差检查登记；不把 N≥800/Q1 N≥1600
  # 写成无条件要求；final_N/config_id 未通过正式验收前保持 null，不填历史探针值。
  per_question:
    q1:
      candidate_N: [200, 400, 800, 1600, 3200]   # 附录2 早期表面层探针指向更细网格（候选集合）
      final_N: null                              # 待 result1 早期行 5e-4 误差检查登记
      applies_event: false                       # Q1 仅解到 1800 s，不求 0.15 达标事件、不续算 600 s
      checks: ["V-1", "V-2", "V-3(1/10/100 s 表面)"]
    q23:
      candidate_N: [200, 400, 800, 1600]
      final_N: null                              # 待长时 t* + 早期表面 5e-4 登记
      applies_event: true
      checks: ["V-3(长时表点/表面通量/t*)", "V-4a/b/c", "V-6", "V-11"]
    q4:
      candidate_N: [200, 400, 800, 1600]
      final_N: null                              # 须独立通过自身精度检查，不因与 q23 同配置而豁免
      applies_event: true
      checks: ["V-3(晚期剖面/固定厘米重构)", "V-4a/b/c(含 1/R)", "V-10", "V-13"]
  # 候选阶段实际生效配置（本轮：配置真正接入运行）。与上面默认 interface=harmonic 明确区分：
  # 候选运行用积分界面；stage_N 为候选阶段各问所用网格（取自 candidate_N，非无条件最终要求，
  # final_N 仍待正式验收登记）。runners/verify 从此解析取值，不再写死默认。
  candidate:
    interface: "integral"
    integral_npts: 8
    stage_N: {q1: 1600, q23: 800, q4: 800}
    t_cap_h: {q23: 90.0, q4: 200.0}
  picard:
    tol_dC: 1.0e-9                      # 状态增量 ∞-范数，kg/kg
    tol_dT_K: 1.0e-7
    tol_res_C_rel: 1.0e-10              # 非线性残差（速率形式）相对 C0/dt 归一化
    tol_res_T_K_per_s: 1.0e-8
    max_iter: 30
  retry:
    halvings_max: 10
    dt_min_s: 1.0e-3
    resample_rule: "减步后在原 1 s 网格点上重新对齐（子步终点落在整数秒），断点处强制落点"
  bdf:
    rtol: 1.0e-8
    atol_C: 1.0e-11
    atol_T_K: 1.0e-8
    atol_I: 1.0e-11                     # 累计通量辅助态 I 的绝对容差（PATCH-05）
    max_step_data_s: 60.0
    max_step_after_s: 600.0
    restart_at_breakpoints: true
    jac_sparsity: "物理子系统 2x2 块三对角（含 T→D、C→b/k 交叉块）；启用增广态时扩到 2n+1，辅助行仅依赖表面 C 节点"
  # BDF 累计通量辅助态（PATCH-05）：y=[C_0..C_N, T_0..T_N, I]，I(0)=0，İ=(2 h_m/R)(C_N−C_env)，
  # 固定域 R=R0、Q4 取 R(t)；物理方程不依赖 I；事件只对 C 分量求极大；断点重启/检查点/续算保留 I 累计值；
  # 归一化收支 Cbar(t)−Cbar(0)+I(t)（V-4a）。当前求解器已实现增广态（默认关闭，V-4a/BDF 时启用）。
  augmented_flux_state:
    enabled_for: ["V-4a(BDF)"]
    init_I: 0.0
    event_components: "C_only"
  envelope_tol:
    C: 1.0e-9
    T_K: 1.0e-6

q4:
  kinematics: "affine"                  # D10 K-1
  frame: "reference_x"                  # D10 N-1
  mesh_velocity: "solid"
  axial: "fixed_L"

criterion:
  applies_to: ["q23", "q4"]             # Q1 仅解到 1800 s，不适用达标事件/续算（PATCH-02）
  threshold: 0.15
  domain: "full_unrounded"              # 全节点（分段线性重构的全域最大值即节点最大值）
  event: "continuous_root_on_reconstructed_field"   # g(t)=max_i[(1-a)C_i^n + a C_i^{n+1}] - 0.15；仅对 C 分量
  post_margin_s: 600                    # 达标后续算 600 s 仅数值异常检查（C_max<=0.15+1e-9），非全未来不回穿的数学证明
  t_sample_rule: "首个 60 s 网格点使实测（未舍入）max C < 0.15"
  t_safe:                               # 可选数值裕量诊断（PATCH-06）：默认关闭；关闭时不作积分终点/表脚注/发布必需，续算上限不用 max(...,t_safe)
    enabled: false
    rule: "首个时刻使 max C < 0.15 - delta；delta 由生产配置与更精细对照估计（数值裕量，非认证）"

output:
  decimals: 4
  number_format: "0.0000"
  excel_max_rows_including_header: 1048576
  result1: {t_s: "1..1800", cols_cm: "0..2.0 step 0.1", sheets: ["温度", "水分浓度"]}
  result2: {t_end: "until_dry_1s", cols_cm: "0..2.0 step 0.1", sheets: ["温度", "水分浓度"]}   # 正式导出仅允许达标终点 until_dry_1s
  result2_test_modes: ["3h", "72h"]     # 仅测试模式（PATCH-04），不得导出为正式 result2
  result3: {t_s: "60..t_sample step 60", cols_cm: "0..2.0 step 0.1", sheet: "Sheet1"}
  result4: {t_s: "60..t_sample step 60", cols_cm: "0..1.9 step 0.1", surface_col: "药材表面", outside_fill: "blank", sheet: "Sheet1"}
  a1_text: "时间\\到药材中心的距离"

acceptance:
  table_points: {dT_degC: 0.01, dC: 5.0e-4}          # 生产配置 vs 更精细对照
  t_star_h: 0.02
  early_rows: {times_s: [1, 10, 100], rule: "同源轨迹，误差预算必须覆盖；不得自动豁免"}
  analytic_spatial: {rule: "半离散精确解对照，二阶收敛", tol_factor: 2.0e-4}
  analytic_temporal: {rule: "固定细网格，BE dt=1/0.5/0.25 s 一阶收敛"}
  discrete_balance_rel: 1.0e-12                       # V-4a：BE 离散代数收支（实际时间格式权重）；BDF 用累计通量辅助态 I，归一化 Cbar(t)-Cbar(0)+I(t)
  # V-4b 按时间格式分栏（PATCH-05）：BE 用端点式 I_trap-I_BE=(Δt/2)(f0-fN) 且 O(Δt)；BDF 用独立通量求积 + 加密对照，不套 BE 一阶要求
  flux_integral:
    be: {method: "trapezoid_vs_cumulative", tol_rel: 1.0e-4, order: "O(dt)", note: "减步后用各子步实际步长权重，不用固定 1 s"}
    bdf: {method: "independent_quadrature_refine", tol_rel_factor_of_rtol: 10.0}
  # V-4c 有效热残差：单位长度 W/m 口径（PATCH-05，去 L）；参考尺度不含 L；若导数取自同一离散 RHS 则仅检离散代数平衡，时间精度由 V-3 独立核验
  energy_residual: {unit: "W/m", abs_W_per_m: 1.0e-6, rel: 1.0e-8, ref_scale: "2*pi*R(t)*h*max(dT_ref, 1 K)"}

production:
  approved: false
  config_id: null
  # D12：依适用于该问的数值检验（Q1: V-1/2/3；Q23: V-3/4/6/11；Q4: V-3/4/10/13）选定并登记配置。
  # V-8/V-9 是导出后的文件验收，非 D12 前置（PATCH-02）。改物性/边界/几何/网格/积分方法后，受影响的旧轨迹失效，
  # 按新配置从原始初态重积分再验证与导出；仅改文件格式/文案可复用仍有效的未舍入轨迹。
  note: "候选（N、interface、scheme）经各问数值检验选定后写入 config_id 并置 approved=true；未通过前保持 null/false，不填历史探针值"

storage:
  full_field_cache: false
  checkpoint_interval_s: 3600
  keep_profiles_at: "输出采样时刻（1 s/60 s 行）与表格时刻"
  keep_scalars: ["Cbar", "Cmax", "argmax", "C_surface", "T_surface", "flux", "RM", "RE"]
  scenario_keep_full_trajectory: false
